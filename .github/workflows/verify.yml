name: PR-25 verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MINDC_VERSION: v0.10.2
  MINDC_LINUX_X64_TARBALL_SHA256: 0c8beb4464f8c7d638a81c2dd8ad5eac81a0ddbc7556be711f00e029d01ef258

jobs:
  public-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR-25
        uses: actions/checkout@v5

      - name: Run Python reference verification
        run: |
          set -euo pipefail
          cd reference_model
          python3 pr25_model_check.py
          python3 pr25_verify.py --output /tmp/verified_results.json

      - name: Install pinned public MIND compiler
        run: |
          set -euo pipefail
          url="https://github.com/star-ga/mind/releases/download/${MINDC_VERSION}/mindc-linux-x64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o /tmp/mindc-linux-x64.tar.gz
          echo "${MINDC_LINUX_X64_TARBALL_SHA256}  /tmp/mindc-linux-x64.tar.gz" | sha256sum -c -
          mkdir -p /tmp/mindc-release
          tar -xzf /tmp/mindc-linux-x64.tar.gz -C /tmp/mindc-release
          test -x /tmp/mindc-release/mindc
          /tmp/mindc-release/mindc --version

      - name: Check all public MIND sources
        run: |
          set -euo pipefail
          MINDC=/tmp/mindc-release/mindc
          "$MINDC" check mind_reference/src/pr25_reference.mind
          "$MINDC" check mind_reference/src/pr25_parity_digest.mind
          "$MINDC" check mind_reference/src/pr25_malformed_boundary.mind

      - name: Check canonical malformed-input reference corpus
        run: |
          set -euo pipefail
          python3 mind_reference/verify/malformed_reference.py > /tmp/malformed-baseline.txt
          test "$(wc -l < /tmp/malformed-baseline.txt)" -eq 7000
          python3 mind_reference/verify/malformed_reference.py --mutant flip-first > /tmp/malformed-mutant.txt
          if cmp -s /tmp/malformed-baseline.txt /tmp/malformed-mutant.txt; then
            echo "FAIL: malformed-input negative control was not detected" >&2
            exit 1
          fi
          echo "PASS: 7000 canonical descriptors enumerated; negative control changes transcript"

      - name: Native gate availability note
        run: |
          cat <<'EOF'
          Public GitHub-hosted runners intentionally do not claim native MIND execution here.
          mindc build requires the separately provisioned CPU runtime package.
          The authoritative native gate is mind_reference/verify/run_gates.sh and remains fail-closed.
          Run it on a runtime-equipped environment before merging changes to native MIND behavior.
          EOF
