name: PR-25 verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MINDC_VERSION: v0.10.2
  MINDC_LINUX_X64_TARBALL_SHA256: 0c8beb4464f8c7d638a81c2dd8ad5eac81a0ddbc7556be711f00e029d01ef258

jobs:
  reference-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR-25
        uses: actions/checkout@v5

      - name: Run Python reference verification
        run: |
          set -euo pipefail
          cd reference_model
          python3 pr25_model_check.py
          python3 pr25_verify.py --output /tmp/verified_results.json

      - name: Install MLIR toolchain
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            sudo apt-get update || true
            if sudo apt-get install -y --fix-missing mlir-20-tools clang-20; then ok=1; break; fi
            echo "apt attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ]
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Verify native toolchain
        run: |
          set -euo pipefail
          mlir-opt --version | head -1
          mlir-translate --version | head -1
          clang --version | head -1

      - name: Install pinned MIND compiler artifact
        run: |
          set -euo pipefail
          url="https://github.com/star-ga/mind/releases/download/${MINDC_VERSION}/mindc-linux-x64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o /tmp/mindc-linux-x64.tar.gz
          echo "${MINDC_LINUX_X64_TARBALL_SHA256}  /tmp/mindc-linux-x64.tar.gz" | sha256sum -c -
          mkdir -p /tmp/mindc-release
          tar -xzf /tmp/mindc-linux-x64.tar.gz -C /tmp/mindc-release
          test -x /tmp/mindc-release/mindc
          /tmp/mindc-release/mindc --version

      - name: Run pure-MIND gates
        env:
          MINDC: /tmp/mindc-release/mindc
        run: |
          set -euo pipefail
          ./mind_reference/verify/run_gates.sh
